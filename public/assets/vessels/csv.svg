<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Stylized illustration of a Construction Support Vessel (CSV)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000061"/>
      <stop offset="62%" stop-color="#0087cb"/>
      <stop offset="100%" stop-color="#00e2fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02b5ca"/>
      <stop offset="100%" stop-color="#000043"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="648" cy="118" r="50" fill="#ffffff" opacity="0.16"/>
  <rect y="318" width="800" height="162" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30,360 q28,-12 56,0 t56,0 t56,0 t56,0"/>
    <path d="M360,388 q28,-12 56,0 t56,0 t56,0 t56,0"/>
  </g>
  <!-- CSV: large hull, helideck over forward bridge, tall offshore crane aft -->
  <g>
    <path d="M132,300 L624,300 Q666,300 684,316 L658,330 L178,330 Q144,330 132,312 Z" fill="#ffffff"/>
    <rect x="500" y="244" width="98" height="58" rx="4" fill="#ffffff"/>
    <!-- helideck -->
    <ellipse cx="549" cy="240" rx="60" ry="12" fill="#ffffff"/>
    <text x="549" y="245" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#000061">H</text>
    <rect x="516" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="540" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="564" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <!-- tall offshore crane (aft) -->
    <line x1="320" y1="300" x2="320" y2="196" stroke="#ffffff" stroke-width="9"/>
    <line x1="320" y1="204" x2="232" y2="262" stroke="#ffffff" stroke-width="6"/>
    <line x1="240" y1="262" x2="240" y2="292" stroke="#00e2fd" stroke-width="4"/>
    <rect x="226" y="292" width="28" height="8" rx="2" fill="#0087cb"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.85" letter-spacing="3">CONSTRUCTION SUPPORT VESSEL · CSV</text>
</svg>
