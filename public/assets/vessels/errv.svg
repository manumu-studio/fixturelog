<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Stylized illustration of an Emergency Response and Rescue Vessel (ERRV)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000061"/>
      <stop offset="62%" stop-color="#0087cb"/>
      <stop offset="100%" stop-color="#00e2fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02b5ca"/>
      <stop offset="100%" stop-color="#000043"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="648" cy="118" r="50" fill="#ffffff" opacity="0.16"/>
  <rect y="318" width="800" height="162" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30,360 q28,-12 56,0 t56,0 t56,0 t56,0"/>
    <path d="M360,388 q28,-12 56,0 t56,0 t56,0 t56,0"/>
  </g>
  <!-- ERRV: compact standby hull, tall bridge, fast rescue craft on side davits -->
  <g>
    <path d="M236,302 L560,302 Q598,302 614,316 L590,330 L276,330 Q244,330 236,314 Z" fill="#ffffff"/>
    <rect x="452" y="248" width="92" height="54" rx="4" fill="#ffffff"/>
    <rect x="468" y="260" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="492" y="260" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="516" y="260" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="502" y="222" width="10" height="26" fill="#ffffff"/>
    <!-- davit + fast rescue craft -->
    <line x1="330" y1="302" x2="330" y2="262" stroke="#ffffff" stroke-width="6"/>
    <line x1="330" y1="266" x2="300" y2="280" stroke="#ffffff" stroke-width="5"/>
    <path d="M286,286 L322,286 L314,300 L294,300 Z" fill="#00e2fd"/>
    <!-- search light beam cue -->
    <circle cx="556" cy="236" r="6" fill="#00e2fd"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.85" letter-spacing="2">EMERGENCY RESPONSE &amp; RESCUE · ERRV</text>
</svg>
