<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Stylized illustration of a Dive Support Vessel (DSV)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000061"/>
      <stop offset="62%" stop-color="#0087cb"/>
      <stop offset="100%" stop-color="#00e2fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02b5ca"/>
      <stop offset="100%" stop-color="#000043"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="648" cy="118" r="50" fill="#ffffff" opacity="0.16"/>
  <rect y="318" width="800" height="162" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30,360 q28,-12 56,0 t56,0 t56,0 t56,0"/>
    <path d="M360,388 q28,-12 56,0 t56,0 t56,0 t56,0"/>
  </g>
  <!-- DSV: hull with forward bridge and amidships saturation-dive moonpool gantry -->
  <g>
    <path d="M140,300 L612,300 Q654,300 672,316 L646,330 L186,330 Q152,330 140,312 Z" fill="#ffffff"/>
    <rect x="500" y="246" width="96" height="56" rx="4" fill="#ffffff"/>
    <rect x="516" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="540" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="564" y="258" width="16" height="14" rx="2" fill="#000061"/>
    <!-- dive gantry / moonpool tower amidships -->
    <rect x="300" y="226" width="92" height="74" rx="3" fill="none" stroke="#ffffff" stroke-width="7"/>
    <line x1="346" y1="226" x2="346" y2="300" stroke="#ffffff" stroke-width="4"/>
    <line x1="300" y1="262" x2="392" y2="262" stroke="#ffffff" stroke-width="4"/>
    <!-- dive bell on wire -->
    <line x1="346" y1="262" x2="346" y2="296" stroke="#00e2fd" stroke-width="4"/>
    <circle cx="346" cy="302" r="9" fill="#0087cb"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.85" letter-spacing="3">DIVE SUPPORT VESSEL · DSV</text>
</svg>
