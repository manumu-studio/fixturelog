<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Stylized illustration of a Platform Supply Vessel (PSV)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000061"/>
      <stop offset="62%" stop-color="#0087cb"/>
      <stop offset="100%" stop-color="#00e2fd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02b5ca"/>
      <stop offset="100%" stop-color="#000043"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <circle cx="648" cy="118" r="50" fill="#ffffff" opacity="0.16"/>
  <rect y="318" width="800" height="162" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30,356 q28,-12 56,0 t56,0 t56,0 t56,0"/>
    <path d="M360,386 q28,-12 56,0 t56,0 t56,0 t56,0"/>
  </g>
  <!-- PSV: long low hull, forward bridge, large open aft cargo deck -->
  <g>
    <path d="M150,300 L600,300 Q642,300 660,316 L636,330 L196,330 Q162,330 150,314 Z" fill="#ffffff"/>
    <rect x="470" y="252" width="96" height="50" rx="4" fill="#ffffff"/>
    <rect x="486" y="262" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="510" y="262" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="534" y="262" width="16" height="14" rx="2" fill="#000061"/>
    <rect x="524" y="226" width="10" height="28" fill="#ffffff"/>
    <line x1="529" y1="208" x2="529" y2="226" stroke="#ffffff" stroke-width="4"/>
    <!-- aft deck crane -->
    <line x1="452" y1="300" x2="452" y2="258" stroke="#ffffff" stroke-width="6"/>
    <line x1="452" y1="262" x2="404" y2="284" stroke="#ffffff" stroke-width="5"/>
    <!-- cargo containers on open deck -->
    <rect x="250" y="284" width="34" height="16" rx="2" fill="#00e2fd"/>
    <rect x="292" y="284" width="34" height="16" rx="2" fill="#0087cb"/>
    <rect x="334" y="284" width="34" height="16" rx="2" fill="#00e2fd"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffffff" opacity="0.85" letter-spacing="4">PLATFORM SUPPLY VESSEL · PSV</text>
</svg>
