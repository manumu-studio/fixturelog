# FixtureLog voice worker - Python livekit-agents project (deploys to Railway).
# Pins the LiveKit Agents line plus the provider plugins the brains use:
# Deepgram (STT), Anthropic + Cartesia (pipeline brain), OpenAI (realtime brain),
# Silero + turn-detector (VAD / turn detection).

[project]
name = "fixturelog-voice-worker"
version = "0.1.0"
description = "FixtureLog Broker Copilot voice worker (LiveKit Agents)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "livekit-agents[deepgram,anthropic,cartesia,silero,turn-detector,openai]~=1.6",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
